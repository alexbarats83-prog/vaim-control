{% extends 'base.html' %}
{% block title %}Ошибка {{ code }}{% endblock %}
{% block content %}
<section class="panel form-panel error-panel"><h1>Ошибка {{ code }}</h1><p>{{ message }}</p><a class="btn btn-primary" href="{{ url_for('dashboard.home') if user else url_for('auth.login') }}">{{ 'На главную' if user else 'К странице входа' }}</a></section>
{% endblock %}
