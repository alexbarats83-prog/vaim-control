name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: vaim_test
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: vaim_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vaim_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 'requirements*.txt'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m pytest -q
        env:
          VAIM_TEST_POSTGRES_URL: postgresql+psycopg://vaim_test:test-only@127.0.0.1:5432/vaim_test
